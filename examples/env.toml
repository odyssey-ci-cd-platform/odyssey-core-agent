# =============================================================================
# Odyssey Example Environment Configuration
# =============================================================================
# This file lives at <project-root>/.odyssey/env.toml and is OPTIONAL.
# Environment variables defined here are merged into EVERY job's env.
# Job-level env values take precedence over these globals.

[env]
# Secrets and shared configuration — keep sensitive values in a vault/secrets
# manager and inject them here at runtime rather than hardcoding.
DOCKER_REGISTRY = "registry.example.com"
LOG_LEVEL       = "info"
CI              = "true"
