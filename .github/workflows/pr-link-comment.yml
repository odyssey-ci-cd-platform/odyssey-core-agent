---
name: pr-link-comment

on:
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: read

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          ref=$(printf '%s' "$BODY" | grep -oE '#[0-9]+' | head -1)
          issue=$(printf '%s' "$ref" | tr -d '#')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "PR: $URL"
          fi
